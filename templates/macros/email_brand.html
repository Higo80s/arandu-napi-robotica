{# Cabeçalho de assunto — abaixo da logo NAPI-Robótica. #}

{% macro email_header(titulo, subtitulo='') -%}

<div style="background:#002e6d; color:#ffffff; padding:16px 24px; text-align:center; border-bottom:3px solid #0284c7;">

    <h2 style="margin:0; font-family:'Segoe UI',Arial,sans-serif; font-size:18px; font-weight:600; color:#ffffff; line-height:1.3;">{{ titulo }}</h2>

    {% if subtitulo %}

    <p style="margin:8px 0 0; font-family:'Segoe UI',Arial,sans-serif; font-size:13px; color:#e0f2fe; opacity:0.95;">{{ subtitulo }}</p>

    {% endif %}

</div>

{%- endmacro %}
