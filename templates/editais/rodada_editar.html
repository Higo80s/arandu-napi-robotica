{% extends "base.html" %}
{% from 'macros/icons.html' import icon %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <!-- Header -->
    <div class="mb-4 d-flex align-items-center gap-3">
        <a href="{{ url_for('editais.painel_selecao', id=edital.id, rodada_id=rodada.id) }}" class="btn-icon">
            {{ icon('arrow-left', size=20) }}
        </a>
        <h2 class="h4 mb-0 fw-bold">Editar Chamada</h2>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('editais.rodadas_editar', id=rodada.id) }}">

                <div class="mb-4">
                    <label class="form-label fw-bold small">Nome da Chamada</label>
                    <input type="text" name="nome" class="form-control" value="{{ rodada.nome }}" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Data de Início</label>
                        <input type="date" name="data_inicio" class="form-control"
                            value="{{ rodada.data_inicio|date_iso }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Data de Fim</label>
                        <input type="date" name="data_fim" class="form-control" value="{{ rodada.data_fim|date_iso }}"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small">Descrição</label>
                    <textarea name="descricao" class="form-control" rows="4">{{ rodada.descricao or '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a href="{{ url_for('editais.painel_selecao', id=edital.id, rodada_id=rodada.id) }}"
                        class="btn btn-light">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
