<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de Senha - Arandu</title>

    <!-- Faz uso dos mesmos estilos do login para consistência -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/simbolo_marangatu.png') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
        }

        .login-card {
            max-width: 450px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Troca de Senha Obrigatória</h2>
                <p class="subtitle">Por segurança, você deve alterar sua senha no primeiro acesso.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }} text-center"
                style="margin-bottom: 20px; padding: 10px; border-radius: 8px; font-size: 0.9em; background-color: #fee2e2; color: #991b1b;">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.change_password') }}" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="new_password">Nova Senha</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="new_password" name="new_password" placeholder="Mínimo 6 caracteres"
                            required minlength="6"
                            style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="confirm_password">Confirme a Senha</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Repita a senha" required
                            style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 25px; background-color: #f59e0b;">
                    <i data-lucide="save"></i> Salvar Nova Senha
                </button>
            </form>

            <div class="login-help" style="margin-top: 20px; text-align: center;">
                <a href="{{ url_for('auth.logout') }}" class="help-link">
                    <i data-lucide="log-out"></i> Voltar / Sair
                </a>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
