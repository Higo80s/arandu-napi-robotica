{% extends "base.html" %}

{% block title %}Verificação de 2 Fatores{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-shield-alt"></i> Autenticação de 2 Fatores</h4>
            </div>
            <div class="card-body">
                <p class="text-muted text-center">
                    Sua conta está protegida com 2FA. <br>
                    Insira o código de 6 dígitos gerado pelo seu aplicativo autenticador.
                </p>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-4 text-center">
                        <label for="token" class="form-label fw-bold">Código de Autenticação</label>
                        <input type="text" class="form-control form-control-lg text-center fw-bold" id="token"
                            name="token" placeholder="000 000" maxlength="6" inputmode="numeric"
                            autocomplete="one-time-code" required autofocus
                            style="letter-spacing: 5px; font-size: 1.5rem;">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-check-circle"></i> Verificar Código
                        </button>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary">
                            Cancelar Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
