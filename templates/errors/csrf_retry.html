<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão Expirada - Arandu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .card {
            max-width: 500px;
            width: 100%;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            background-color: #fef2f2;
            /* Red-50 */
            color: #991b1b;
            /* Red-800 */
            border-bottom: 1px solid #fee2e2;
            font-weight: 600;
            padding: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .btn-primary {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        .btn-primary:hover {
            background-color: #b91c1c;
            border-color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header text-center">
            <h4>⚠️ Sessão Expirada</h4>
        </div>
        <div class="card-body">
            <div id="loginSection">
                <p class="text-muted mb-4">
                    Para garantir sua segurança e salvar seus dados, por favor, confirme sua senha abaixo:
                </p>

                <form id="inlineLoginForm" onsubmit="handleInlineLogin(event)">
                    <div class="mb-3 text-start">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" id="btnLogin">
                        Entrar e Salvar
                    </button>
                    <div id="loginError" class="text-danger mt-2" style="display: none;"></div>
                </form>
            </div>

            <div id="statusMessage" class="alert alert-info mt-3" style="display: none;">
                Verificando sessão...
            </div>

            <!-- Formulário Oculto para Reenvio -->
            <form action="{{ request_url }}" method="POST" id="retryForm" style="display: none;">
                <!-- Data Preservation -->
                {% for key, value in form_data.items() %}
                {% if key != 'csrf_token' %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
                {% endif %}
                {% endfor %}

                <!-- Novo Token CSRF será injetado aqui via JS -->
                <input type="hidden" name="csrf_token" id="csrf_token_field" value="">
            </form>
        </div>
    </div>

    <script>
        async function handleInlineLogin(event) {
            event.preventDefault();
            const form = document.getElementById('inlineLoginForm');
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('loginError');

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = 'Autenticando...';

            const formData = new FormData(form);

            try {
                const response = await fetch("{{ url_for('auth.login') }}", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Login authorized! Proceed to recovery.
                    tryRecovery();
                } else {
                    throw new Error(data.message || 'Erro ao fazer login');
                }
            } catch (e) {
                console.error(e);
                errorDiv.innerText = e.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Entrar e Salvar';
            }
        }

        async function tryRecovery() {
            const container = document.getElementById('loginSection');
            const status = document.getElementById('statusMessage');

            // Hide login form
            container.style.display = 'none';

            status.style.display = 'block';
            status.className = 'alert alert-info';
            status.innerText = 'Restaurando sessão e salvando dados...';

            try {
                // 1. Tenta obter novo token CSRF (via API protegida)
                const response = await fetch("{{ url_for('api_utils.refresh_csrf') }}");

                if (response.ok) {
                    const data = await response.json();

                    // 2. Atualiza o token no formulário
                    document.getElementById('csrf_token_field').value = data.csrf_token;

                    status.className = 'alert alert-success';
                    status.innerText = 'Sucesso! Reenviando formulário...';

                    // 3. Re-submete o formulário original
                    document.getElementById('retryForm').submit();
                } else {
                    throw new Error('Falha ao restaurar sessão após login.');
                }
            } catch (e) {
                console.error(e);
                status.className = 'alert alert-danger';
                status.innerHTML = '<strong>Erro Crítico:</strong> Não foi possível recuperar a sessão.<br>Copie seus dados se possível.';
                // Show login form again?
                container.style.display = 'block';
            }
        }
    </script>
</body>

</html>
